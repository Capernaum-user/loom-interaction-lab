<head>

<body class="fd-interactive-page" data-category="scroll-storytelling">
  <header class="top-strip">
    <strong>08 Scroll-Driven Storytelling</strong>
    <a href="../00_Index/FirstDesign_interactive-elements-gallery_active.html">All elements</a>
  </header>
  <main class="demo-shell">
    <section class="hero-panel">
      <span class="eyebrow">08 / 스크롤 스토리텔링</span>
      <h1>Scroll-Driven Storytelling</h1>
      <p>스크롤을 시간축으로 삼아 단계별 장면, 타임라인, 데이터 변화를 전개하는 패턴.</p>
    </section>
    <section class="demo-grid" aria-label="Scroll-Driven Storytelling demos">
      <article class="demo-card wide-card story-card">
  <div class="demo-copy">
    <span class="eyebrow">Story</span>
    <h2>Step-driven scene</h2>
    <p>각 단계가 장면, 수치, 설명을 함께 바꾼다.</p>
  </div>
  <div class="story-layout">
    <div class="story-scene" data-story-scene>
      <span data-story-number>01</span>
      <strong data-story-title>Map the intent</strong>
    </div>
    <div class="story-steps">
      <button class="story-step is-active" data-demo-action="story-step" data-title="Map the intent">01 Intent</button>
      <button class="story-step" data-demo-action="story-step" data-title="Build the system">02 System</button>
      <button class="story-step" data-demo-action="story-step" data-title="Ship the page">03 Ship</button>
    </div>
  </div>
</article>
    </section>
  </main>
  <script src="../00_Index/FirstDesign_interactive-common_active.js"></script>
